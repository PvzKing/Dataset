<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konversi Satuan</title>
<link rel="icon" href="data:,">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #eef2f7; color: #1f2933; line-height: 1.5; }
  main { max-width: 520px; margin: 32px auto; padding: 0 16px; }
  .kartu { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0, 0, 0, .08); }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { margin: 0 0 20px; color: #52606d; }
  .baris { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bidang { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; min-width: 0; }
  label { font-weight: 600; font-size: .9rem; }
  select, input { width: 100%; font: inherit; padding: 10px; border: 1px solid #cbd2d9; border-radius: 8px; background: #fff; color: inherit; }
  select:focus, input:focus { outline: 3px solid #93c5fd; border-color: #2563eb; }
  .hasil { padding: 16px; border-radius: 10px; background: #eff6ff; border: 1px solid #bfdbfe; }
  .hasil .judul { font-size: .85rem; color: #52606d; }
  .hasil output { display: block; font-size: 1.6rem; font-weight: 700; color: #1d4ed8; overflow-wrap: anywhere; }
  .keterangan { font-size: .9rem; color: #52606d; margin: 4px 0 0; overflow-wrap: anywhere; }
  .keterangan.peringatan { color: #b91c1c; }
  @media (max-width: 420px) { .baris { grid-template-columns: 1fr; gap: 0; } }
</style>
</head>
<body>
<main>
  <div class="kartu">
    <h1>Konversi Satuan</h1>
    <p class="sub">Pilih kategori dan satuan, lalu ketik angka. Hasil langsung muncul tanpa menekan tombol.</p>
    <div class="bidang">
      <label for="kategori">Kategori</label>
      <select id="kategori">
        <option value="panjang">Panjang</option>
        <option value="berat">Berat</option>
        <option value="suhu">Suhu</option>
      </select>
    </div>
    <div class="baris">
      <div class="bidang">
        <label for="dari">Satuan asal</label>
        <select id="dari"></select>
      </div>
      <div class="bidang">
        <label for="ke">Satuan tujuan</label>
        <select id="ke"></select>
      </div>
    </div>
    <div class="bidang">
      <label for="nilai">Nilai</label>
      <input id="nilai" type="number" step="any" inputmode="decimal" placeholder="Contoh: 100">
    </div>
    <div class="hasil" aria-live="polite">
      <div class="judul">Hasil konversi</div>
      <output id="hasil" for="nilai kategori dari ke">–</output>
      <p class="keterangan" id="keterangan">Ketik angka untuk melihat hasilnya.</p>
    </div>
  </div>
</main>
<script>
  // Faktor = nilai satuan dalam satuan dasar (meter untuk panjang, gram untuk berat).
  const SATUAN = {
    panjang: {
      mm: ['Milimeter', 'mm', 0.001], cm: ['Sentimeter', 'cm', 0.01], m: ['Meter', 'm', 1],
      km: ['Kilometer', 'km', 1000], in: ['Inci', 'in', 0.0254], ft: ['Kaki', 'ft', 0.3048],
      yd: ['Yard', 'yd', 0.9144], mi: ['Mil', 'mi', 1609.344]
    },
    berat: {
      mg: ['Miligram', 'mg', 0.001], g: ['Gram', 'g', 1], ons: ['Ons (100 g)', 'ons', 100],
      kg: ['Kilogram', 'kg', 1000], ton: ['Ton', 't', 1000000],
      oz: ['Ounce', 'oz', 28.349523125], lb: ['Pon', 'lb', 453.59237]
    },
    suhu: { c: ['Celsius', '°C'], f: ['Fahrenheit', '°F'], k: ['Kelvin', 'K'] }
  };
  const BAWAAN = { panjang: ['m', 'km'], berat: ['kg', 'g'], suhu: ['c', 'f'] };

  const elKategori = document.getElementById('kategori');
  const elDari = document.getElementById('dari');
  const elKe = document.getElementById('ke');
  const elNilai = document.getElementById('nilai');
  const elHasil = document.getElementById('hasil');
  const elKet = document.getElementById('keterangan');
  const angka = new Intl.NumberFormat('en-US', { maximumSignificantDigits: 10, useGrouping: false });
  const format = (x) => angka.format(x + 0); // "+ 0" mengubah -0 menjadi 0

  function isiSatuan() {
    const daftar = SATUAN[elKategori.value];
    [elDari, elKe].forEach((sel, i) => {
      sel.innerHTML = '';
      Object.keys(daftar).forEach((kode) => {
        const [nama, simbol] = daftar[kode];
        sel.add(new Option(nama.includes('(') ? nama : nama + ' (' + simbol + ')', kode));
      });
      sel.value = BAWAAN[elKategori.value][i];
    });
  }

  function keCelsius(v, u) { return u === 'c' ? v : u === 'f' ? (v - 32) * 5 / 9 : v - 273.15; }
  function dariCelsius(c, u) { return u === 'c' ? c : u === 'f' ? c * 9 / 5 + 32 : c + 273.15; }

  function konversi(v, kategori, dari, ke) {
    if (kategori === 'suhu') return dariCelsius(keCelsius(v, dari), ke);
    const d = SATUAN[kategori];
    return v * d[dari][2] / d[ke][2];
  }

  function hitung() {
    const kategori = elKategori.value;
    const asal = SATUAN[kategori][elDari.value];
    const tujuan = SATUAN[kategori][elKe.value];
    const teks = elNilai.value.trim();
    const v = Number(teks);
    elKet.classList.remove('peringatan');
    if (teks === '' || !Number.isFinite(v)) {
      elHasil.value = '–';
      elKet.textContent = 'Ketik angka untuk melihat hasilnya.';
      return;
    }
    const h = konversi(v, kategori, elDari.value, elKe.value);
    elHasil.value = format(h) + ' ' + tujuan[1];
    elKet.textContent = format(v) + ' ' + asal[1] + ' = ' + format(h) + ' ' + tujuan[1];
    if (kategori === 'suhu' && keCelsius(v, elDari.value) < -273.15 - 1e-9) {
      elKet.textContent += ' — Peringatan: nilai ini di bawah nol mutlak (0 K).';
      elKet.classList.add('peringatan');
    }
  }

  elKategori.addEventListener('change', () => { isiSatuan(); hitung(); });
  elDari.addEventListener('change', hitung);
  elKe.addEventListener('change', hitung);
  elNilai.addEventListener('input', hitung);
  isiSatuan();
  hitung();
</script>
</body>
</html>
