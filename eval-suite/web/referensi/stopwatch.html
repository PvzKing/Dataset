<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stopwatch</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; line-height: 1.5; }
  main { max-width: 460px; margin: 0 auto; padding: 32px 16px; text-align: center; }
  h1 { margin: 0 0 16px; font-size: 1.4rem; font-weight: 600; color: #94a3b8; }
  .layar { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; font-size: clamp(2.6rem, 15vw, 4.2rem); font-weight: 700; margin: 0 0 24px; letter-spacing: .02em; }
  .kontrol { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 28px; }
  button { font: inherit; font-weight: 600; padding: 12px 8px; border: 0; border-radius: 999px; cursor: pointer; color: #fff; background: #334155; min-width: 0; }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:focus-visible { outline: 3px solid #38bdf8; outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #tombol-mulai { background: #16a34a; }
  #tombol-mulai.berjalan { background: #d97706; }
  #tombol-reset { background: #b91c1c; }
  h2 { font-size: 1rem; text-align: left; margin: 0 0 8px; color: #94a3b8; }
  .kosong { text-align: left; color: #64748b; margin: 0; }
  ol { list-style: none; margin: 0; padding: 0; text-align: left; }
  li { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 10px 4px; border-bottom: 1px solid #1e293b; font-variant-numeric: tabular-nums; }
  li .total { color: #64748b; }
  li .waktu-putaran { font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Stopwatch</h1>
  <div class="layar" id="tampilan" role="timer" aria-label="Waktu berjalan">00:00.00</div>
  <div class="kontrol">
    <button type="button" id="tombol-mulai">Mulai</button>
    <button type="button" id="tombol-putaran" disabled>Putaran</button>
    <button type="button" id="tombol-reset">Reset</button>
  </div>
  <section aria-labelledby="judul-putaran">
    <h2 id="judul-putaran">Daftar putaran</h2>
    <p class="kosong" id="kosong">Belum ada putaran. Tekan "Putaran" saat stopwatch berjalan.</p>
    <ol id="daftar-putaran"></ol>
  </section>
</main>
<script>
  const tampilan = document.getElementById('tampilan');
  const tombolMulai = document.getElementById('tombol-mulai');
  const tombolPutaran = document.getElementById('tombol-putaran');
  const tombolReset = document.getElementById('tombol-reset');
  const daftar = document.getElementById('daftar-putaran');
  const kosong = document.getElementById('kosong');

  let berjalan = false;
  let waktuMulai = 0;     // performance.now() saat terakhir dimulai
  let tersimpan = 0;      // milidetik yang terkumpul sebelum jeda terakhir
  let totalPutaranSebelumnya = 0; // dalam perseratus detik
  let nomorPutaran = 0;
  let idFrame = null;

  const dua = (n) => String(n).padStart(2, '0');
  function format(cs) { // cs = perseratus detik
    const menit = Math.floor(cs / 6000);
    const detik = Math.floor(cs / 100) % 60;
    return dua(menit) + ':' + dua(detik) + '.' + dua(cs % 100);
  }
  function berlaluMs() { return tersimpan + (berjalan ? performance.now() - waktuMulai : 0); }
  function berlaluCs() { return Math.floor(berlaluMs() / 10); }

  function gambar() {
    tampilan.textContent = format(berlaluCs());
    if (berjalan) idFrame = requestAnimationFrame(gambar);
  }

  function mulaiAtauJeda() {
    if (berjalan) {
      tersimpan = berlaluMs();
      berjalan = false;
      cancelAnimationFrame(idFrame);
      gambar();
    } else {
      waktuMulai = performance.now();
      berjalan = true;
      gambar();
    }
    tombolMulai.textContent = berjalan ? 'Jeda' : 'Mulai';
    tombolMulai.classList.toggle('berjalan', berjalan);
    tombolPutaran.disabled = !berjalan;
  }

  function catatPutaran() {
    if (!berjalan) return;
    const total = berlaluCs();
    const lama = total - totalPutaranSebelumnya;
    totalPutaranSebelumnya = total;
    nomorPutaran += 1;
    const li = document.createElement('li');
    const nama = document.createElement('span');
    nama.textContent = 'Putaran ' + nomorPutaran;
    const waktu = document.createElement('span');
    waktu.className = 'waktu-putaran';
    waktu.textContent = format(lama);
    const kumulatif = document.createElement('span');
    kumulatif.className = 'total';
    kumulatif.textContent = 'Total ' + format(total);
    li.append(nama, waktu, kumulatif);
    daftar.appendChild(li);
    kosong.hidden = true;
  }

  function reset() {
    berjalan = false;
    cancelAnimationFrame(idFrame);
    tersimpan = 0;
    totalPutaranSebelumnya = 0;
    nomorPutaran = 0;
    daftar.innerHTML = '';
    kosong.hidden = false;
    tombolMulai.textContent = 'Mulai';
    tombolMulai.classList.remove('berjalan');
    tombolPutaran.disabled = true;
    gambar();
  }

  tombolMulai.addEventListener('click', mulaiAtauJeda);
  tombolPutaran.addEventListener('click', catatPutaran);
  tombolReset.addEventListener('click', reset);
</script>
</body>
</html>
