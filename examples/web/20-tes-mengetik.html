<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tes Kecepatan Mengetik</title>
  <style>
    :root { --bg: #1c1917; --surface: #292524; --text: #e7e5e4; --muted: #78716c; --correct: #e7e5e4; --wrong: #f87171; --accent: #fbbf24; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    .app { width: min(100%, 820px); }
    h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
    .sub { margin: 0 0 1.5rem; color: var(--muted); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .durations { display: flex; gap: .25rem; padding: .25rem; border-radius: 10px; background: var(--surface); }
    .durations button { padding: .4rem .9rem; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
    .durations button[aria-pressed="true"] { background: var(--accent); color: #1c1917; }
    .stats { display: flex; gap: 1.5rem; font-variant-numeric: tabular-nums; }
    .stats div { color: var(--muted); font-size: .85rem; }
    .stats strong { display: block; font-size: 1.5rem; color: var(--accent); }

    .text-wrap { padding: 1.25rem 1.5rem; border-radius: 14px; background: var(--surface); }
    .text {
      height: calc(1.9em * 3); overflow: hidden; /* tepat 3 baris, tanpa baris keempat yang terpotong */
      font: 1.35rem/1.9 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); user-select: none; overflow-wrap: break-word;
    }
    .text span.correct { color: var(--correct); }
    .text span.wrong { color: var(--wrong); background: rgba(248, 113, 113, .15); border-radius: 3px; }
    .text span.current { box-shadow: inset 2px 0 0 var(--accent); }
    textarea {
      width: 100%; margin-top: 1rem; padding: 1rem; border: 2px solid var(--surface); border-radius: 12px; resize: none;
      background: #0c0a09; color: var(--text); font: 1.1rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    textarea:focus { border-color: var(--accent); outline: none; }
    textarea:disabled { opacity: .5; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; color: var(--muted); font-size: .9rem; gap: 1rem; flex-wrap: wrap; }
    .btn { padding: .65rem 1.2rem; border: 0; border-radius: 10px; background: var(--accent); color: #1c1917; font: inherit; font-weight: 700; cursor: pointer; }

    .result { margin-top: 1.5rem; padding: 1.5rem; border-radius: 14px; background: var(--surface); text-align: center; }
    .result h2 { margin: 0 0 1rem; }
    .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .result-grid strong { display: block; font-size: 2rem; color: var(--accent); }
    .result-grid span { color: var(--muted); font-size: .9rem; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (max-width: 520px) { .text { font-size: 1.1rem; } .result-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="app">
    <h1>Tes Kecepatan Mengetik</h1>
    <p class="sub">Timer mulai saat kamu mengetik huruf pertama.</p>

    <div class="bar">
      <div class="durations" role="group" aria-label="Durasi tes">
        <button type="button" data-seconds="15" aria-pressed="false">15 dtk</button>
        <button type="button" data-seconds="30" aria-pressed="false">30 dtk</button>
        <button type="button" data-seconds="60" aria-pressed="true">60 dtk</button>
      </div>
      <div class="stats" aria-live="off">
        <div><strong id="time-left">60</strong>detik</div>
        <div><strong id="wpm">0</strong>kata/menit</div>
        <div><strong id="accuracy">100%</strong>akurasi</div>
      </div>
    </div>

    <div class="text-wrap"><div class="text" id="text" aria-hidden="true"></div></div>
    <label for="input" class="sr-only">Ketik teks di atas</label>
    <textarea id="input" rows="2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Mulai mengetik di sini…"></textarea>

    <div class="actions">
      <span>Tekan Esc untuk mengulang.</span>
      <button class="btn" id="restart" type="button">Ulangi</button>
    </div>

    <section class="result" id="result" hidden aria-live="polite">
      <h2>Hasil</h2>
      <div class="result-grid">
        <div><strong id="result-wpm"></strong><span>kata per menit</span></div>
        <div><strong id="result-accuracy"></strong><span>akurasi</span></div>
        <div><strong id="result-chars"></strong><span>karakter benar / salah</span></div>
      </div>
    </section>
  </main>

  <script>
    const WORDS = ('yang dan di itu dengan untuk tidak ini dari dalam akan pada juga saya ke karena bisa ada mereka lebih ' +
      'kata tahun sudah atau saat oleh menjadi orang kami kita baru hari rumah jalan kerja waktu belajar makan minum ' +
      'pagi malam kota desa air buku teman besar kecil cepat lambat baik indah senang pulang pergi datang membaca ' +
      'menulis bermain sekolah pasar hujan matahari laut gunung kopi nasi sore pintu jendela lampu cerita').split(' ');

    const $ = (id) => document.getElementById(id);
    const textEl = $('text');
    const input = $('input');
    let duration = 60;
    let target = '';
    let spans = [];
    let startTime = null;
    let timerId = null;
    let finished = false;

    function randomWords(n) {
      return Array.from({ length: n }, () => WORDS[Math.floor(Math.random() * WORDS.length)]).join(' ');
    }

    function appendText(text) {
      const fragment = document.createDocumentFragment();
      for (const ch of text) {
        const span = document.createElement('span');
        span.textContent = ch;
        fragment.append(span);
        spans.push(span);
      }
      textEl.append(fragment);
      target += text;
    }

    function reset() {
      clearInterval(timerId);
      timerId = null;
      startTime = null;
      finished = false;
      target = '';
      spans = [];
      textEl.replaceChildren();
      textEl.scrollTop = 0;
      appendText(randomWords(60));
      input.value = '';
      input.disabled = false;
      $('result').hidden = true;
      $('time-left').textContent = duration;
      $('wpm').textContent = '0';
      $('accuracy').textContent = '100%';
      highlight();
      input.focus();
    }

    function counts() {
      const typed = input.value;
      let correct = 0;
      for (let i = 0; i < typed.length; i++) if (typed[i] === target[i]) correct++;
      return { typed: typed.length, correct, wrong: typed.length - correct };
    }

    function highlight() {
      const typed = input.value;
      spans.forEach((span, i) => {
        span.className = i < typed.length ? (typed[i] === target[i] ? 'correct' : 'wrong') : i === typed.length ? 'current' : '';
      });
      const current = spans[typed.length];
      if (current) textEl.scrollTop = Math.max(0, current.offsetTop - textEl.offsetTop - textEl.clientHeight / 3);
    }

    // WPM standar: setiap 5 karakter benar dihitung sebagai satu kata.
    function updateStats() {
      const { typed, correct } = counts();
      const minutes = startTime ? (Date.now() - startTime) / 60000 : 0;
      $('wpm').textContent = minutes > 0 ? Math.round(correct / 5 / minutes) : 0;
      $('accuracy').textContent = typed ? `${Math.round((correct / typed) * 100)}%` : '100%';
    }

    function tick() {
      const left = Math.max(0, duration - Math.floor((Date.now() - startTime) / 1000));
      $('time-left').textContent = left;
      updateStats();
      if (left === 0) finish();
    }

    function finish() {
      clearInterval(timerId);
      finished = true;
      input.disabled = true;
      const { typed, correct, wrong } = counts();
      $('result-wpm').textContent = Math.round(correct / 5 / (duration / 60));
      $('result-accuracy').textContent = typed ? `${Math.round((correct / typed) * 100)}%` : '0%';
      $('result-chars').textContent = `${correct} / ${wrong}`;
      $('result').hidden = false;
      $('restart').focus();
    }

    input.addEventListener('input', () => {
      if (finished) return;
      if (!startTime && input.value.length > 0) {
        startTime = Date.now();
        timerId = setInterval(tick, 200);
      }
      // Tambah kata baru sebelum teks habis
      if (target.length - input.value.length < 40) appendText(' ' + randomWords(30));
      highlight();
      updateStats();
    });
    input.addEventListener('paste', (e) => e.preventDefault());
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') e.preventDefault();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') reset();
    });

    document.querySelectorAll('[data-seconds]').forEach((button) => button.addEventListener('click', () => {
      duration = Number(button.dataset.seconds);
      document.querySelectorAll('[data-seconds]').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
      reset();
    }));
    $('restart').addEventListener('click', reset);

    reset();
  </script>
</body>
</html>
