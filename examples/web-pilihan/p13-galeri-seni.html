<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruang Rupa — Galeri Seni Generatif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
  :root { --bg: #f7f5f2; --ink: #161514; --muted: #77726b; --line: #e3dfd8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  button { font: inherit; color: inherit; }
  .wrap { width: min(1280px, 100% - 32px); margin: 0 auto; }
  header { padding: 40px 0 26px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; }
  header h1 { font-family: Georgia, serif; font-weight: 400; font-size: clamp(2.4rem, 7vw, 5rem); line-height: .95; letter-spacing: -.03em; }
  header h1 i { color: #c2410c; }
  header p { color: var(--muted); max-width: 340px; font-size: .95rem; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); margin-bottom: 22px; position: sticky; top: 0; background: rgba(247,245,242,.93); backdrop-filter: blur(8px); z-index: 5; }
  .filters { display: flex; gap: 4px; flex-wrap: wrap; }
  .filters button { border: 0; background: none; padding: 7px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); }
  .filters button.active { background: var(--ink); color: var(--bg); }
  .bar .right { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .9rem; }
  .bar .right button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; cursor: pointer; }

  .masonry { columns: 4 260px; column-gap: 18px; padding-bottom: 60px; }
  .item { break-inside: avoid; margin-bottom: 18px; cursor: zoom-in; display: block; width: 100%; border: 0; background: none; text-align: left; padding: 0; }
  .item canvas { width: 100%; display: block; border-radius: 6px; transition: transform .4s, box-shadow .4s; background: #ddd; }
  .item:hover canvas { transform: translateY(-4px); box-shadow: 0 22px 40px -24px rgba(0,0,0,.5); }
  .item .cap { display: flex; justify-content: space-between; gap: 10px; padding: 8px 2px 0; font-size: .88rem; }
  .item .cap span { color: var(--muted); }
  .item .like { color: #c2410c; }
  .item.hide { display: none; }

  .lightbox { position: fixed; inset: 0; background: rgba(12, 11, 10, .94); z-index: 20; display: none; grid-template-columns: 1fr 320px; color: #f2efe9; }
  .lightbox.open { display: grid; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; } }
  .stage { display: grid; place-items: center; padding: 24px 70px; position: relative; min-width: 0; min-height: 0; }
  .stage canvas { max-width: 100%; max-height: calc(100vh - 48px); border-radius: 4px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: #fff; cursor: pointer; font-size: 1.3rem; }
  .arrow.prev { left: 12px; } .arrow.next { right: 12px; }
  .panel { background: #1c1a18; padding: 28px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .panel h2 { font-family: Georgia, serif; font-weight: 400; font-size: 1.8rem; line-height: 1.1; }
  .panel .artist { color: #b8b2a8; }
  .panel dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .9rem; }
  .panel dt { color: #8f897f; }
  .palette { display: flex; gap: 6px; }
  .palette span { flex: 1; height: 36px; border-radius: 4px; position: relative; cursor: pointer; }
  .palette span:hover::after { content: attr(data-hex); position: absolute; bottom: -20px; left: 0; font-size: .7rem; color: #b8b2a8; }
  .panel .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 16px; }
  .panel .btns button { flex: 1; border: 1px solid rgba(255,255,255,.25); background: none; color: #fff; padding: 10px; border-radius: 10px; cursor: pointer; }
  .panel .btns button.liked { background: #c2410c; border-color: #c2410c; }
  .close { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); color: #fff; font-size: 1.2rem; cursor: pointer; z-index: 2; }
  .counter { position: absolute; top: 24px; left: 24px; color: #8f897f; font-size: .9rem; }
  @media (max-width: 860px) {
    header { grid-template-columns: 1fr; }
    .lightbox.open { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .stage { padding: 60px 12px 12px; }
    .stage canvas { max-height: 52vh; }
    .arrow { top: auto; bottom: 16px; transform: none; width: 40px; height: 40px; }
    .panel { max-height: 40vh; padding: 18px; }
  }
  /* Tipografi: Google Fonts, dengan font sistem sebagai cadangan saat offline */
  body, button { font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header h1, .panel h2 { font-family: "Instrument Serif", Georgia, "Times New Roman", serif; }
  header h1 { font-size: clamp(3rem, 9vw, 6.4rem); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ruang<br><i>Rupa</i></h1>
    <p>Pameran daring karya seni generatif yang terinspirasi motif dan alam Nusantara. Setiap karya digambar langsung oleh browser Anda.</p>
  </header>
  <div class="bar">
    <div class="filters" id="filters"></div>
    <div class="right"><span id="count"></span><button id="shuffle">⟳ Acak ulang</button></div>
  </div>
  <main class="masonry" id="gallery"></main>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title">
  <button class="close" id="lb-close" aria-label="Tutup">✕</button>
  <div class="stage">
    <span class="counter" id="lb-counter"></span>
    <canvas id="lb-canvas"></canvas>
    <button class="arrow prev" id="lb-prev" aria-label="Sebelumnya">‹</button>
    <button class="arrow next" id="lb-next" aria-label="Berikutnya">›</button>
  </div>
  <aside class="panel">
    <h2 id="lb-title"></h2>
    <div class="artist" id="lb-artist"></div>
    <p id="lb-desc" style="color:#d6d0c6;font-size:.95rem"></p>
    <dl id="lb-meta"></dl>
    <div class="palette" id="lb-palette"></div>
    <div class="btns"><button id="lb-like">♡ Suka</button><button id="lb-download">⬇ Unduh PNG</button></div>
  </aside>
</div>

<script>
  const PALETTES = {
    Senja: ['#2b1d3a', '#7a2e4d', '#d1495b', '#edae49', '#f6e7cb'],
    Laut: ['#03256c', '#2541b2', '#1768ac', '#06bee1', '#e6f9ff'],
    Hutan: ['#1b2d1f', '#2f5233', '#76a35c', '#c9d99e', '#f2efe1'],
    Batik: ['#2a1a0f', '#6b3e1f', '#b5762f', '#e3c08d', '#f6ead8'],
    Tropis: ['#073b3a', '#0b6e4f', '#08a045', '#f5b700', '#ff5d73']
  };
  const STYLES = {
    Gelombang: 'Garis-garis sinus berlapis yang bergeser fase, seperti ombak di pantai selatan.',
    Kawung: 'Pola empat lingkaran berulang yang terinspirasi motif batik kawung.',
    Partikel: 'Ratusan titik mengikuti medan aliran (flow field) dari fungsi trigonometri.',
    Mozaik: 'Bidang dibagi secara rekursif menjadi persegi panjang berwarna, seperti tegel rumah lama.',
    Gunung: 'Lapisan punggung bukit dengan noise sederhana, berkabut di kejauhan.'
  };
  const TITLES = ['Fajar di Kintamani', 'Bisik Samudra', 'Ingatan Ibu', 'Jalan Pulang', 'Pagi yang Lambat', 'Rindu Kampung', 'Arus Bawah', 'Langit Rembang', 'Tanah Basah', 'Doa Petani', 'Gema Lembah', 'Tenun Waktu', 'Peta Hujan', 'Selepas Magrib', 'Riak Kecil', 'Cahaya Kelapa'];
  const ARTISTS = ['Sekar Ayu', 'Bima Satria', 'Laras Wening', 'Gilang Ramadhan', 'Putu Ananta'];

  function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

  function draw(cv, art, scale) {
    const W = 600 * scale, H = Math.round(600 * art.ratio) * scale;
    cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    const r = rng(art.seed);
    const pal = PALETTES[art.palette];
    const pick = () => pal[Math.floor(r() * pal.length)];
    g.fillStyle = pal[art.style === 'Kawung' || art.style === 'Mozaik' ? 4 : 0];
    g.fillRect(0, 0, W, H);
    if (art.style === 'Gelombang') {
      const bands = 14 + Math.floor(r() * 10);
      for (let b = 0; b < bands; b++) {
        g.beginPath();
        const y0 = H * (b + .5) / bands, amp = H / bands * (1 + r() * 1.6), f = (1 + r() * 3) / W * Math.PI * 2, ph = r() * 6;
        g.moveTo(0, H);
        for (let x = 0; x <= W; x += 4 * scale) g.lineTo(x, y0 + Math.sin(x * f + ph) * amp + Math.sin(x * f * 2.3) * amp * .3);
        g.lineTo(W, H); g.closePath();
        g.fillStyle = pal[1 + b % 4]; g.globalAlpha = .85; g.fill();
      }
    } else if (art.style === 'Kawung') {
      const n = 4 + Math.floor(r() * 4), s = W / n;
      for (let y = -s; y < H + s; y += s) for (let x = 0; x < W + s; x += s) {
        g.fillStyle = pal[Math.floor(((x + y) / s) % 3) + 1];
        [[0, -1], [1, 0], [0, 1], [-1, 0]].forEach(([dx, dy]) => {
          g.beginPath();
          g.ellipse(x + dx * s * .25, y + dy * s * .25, s * (dx ? .24 : .12), s * (dx ? .12 : .24), 0, 0, Math.PI * 2);
          g.fill();
        });
        g.fillStyle = pal[0];
        g.beginPath(); g.arc(x, y, s * .05, 0, Math.PI * 2); g.fill();
      }
    } else if (art.style === 'Partikel') {
      const k = 1.5 + r() * 3;
      g.lineWidth = 1.2 * scale; g.globalAlpha = .55;
      for (let p = 0; p < 650; p++) {
        let x = r() * W, y = r() * H;
        g.strokeStyle = pal[1 + Math.floor(r() * 4)];
        g.beginPath(); g.moveTo(x, y);
        for (let s = 0; s < 40; s++) {
          const a = Math.sin(x / W * k * 3) + Math.cos(y / H * k * 2) * 2;
          x += Math.cos(a) * 4 * scale; y += Math.sin(a) * 4 * scale;
          g.lineTo(x, y);
        }
        g.stroke();
      }
    } else if (art.style === 'Mozaik') {
      const split = (x, y, w, h, d) => {
        if (d > 5 || (d > 1 && r() < .25) || w < 40 * scale || h < 40 * scale) {
          g.fillStyle = pick(); g.fillRect(x + 3 * scale, y + 3 * scale, w - 6 * scale, h - 6 * scale);
          if (r() < .3) { g.fillStyle = pal[4]; g.beginPath(); g.arc(x + w / 2, y + h / 2, Math.min(w, h) * .3, 0, Math.PI * 2); g.fill(); }
          return;
        }
        if (w > h ? r() < .8 : r() < .2) { const c = w * (.3 + r() * .4); split(x, y, c, h, d + 1); split(x + c, y, w - c, h, d + 1); }
        else { const c = h * (.3 + r() * .4); split(x, y, w, c, d + 1); split(x, y + c, w, h - c, d + 1); }
      };
      split(0, 0, W, H, 0);
    } else {
      const sky = g.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, pal[4]); sky.addColorStop(1, pal[3]);
      g.fillStyle = sky; g.fillRect(0, 0, W, H);
      g.fillStyle = pal[4]; g.globalAlpha = .9; g.beginPath(); g.arc(W * (.2 + r() * .6), H * .28, W * .07, 0, Math.PI * 2); g.fill();
      for (let l = 0; l < 5; l++) {
        g.globalAlpha = .55 + l * .1;
        g.fillStyle = pal[[2, 2, 1, 1, 0][l]];
        const base = H * (.45 + l * .11), f1 = r() * 5, f2 = r() * 5;
        g.beginPath(); g.moveTo(0, H);
        for (let x = 0; x <= W; x += 6 * scale) g.lineTo(x, base - Math.abs(Math.sin(x / W * 3 + f1)) * H * .12 - Math.sin(x / W * 11 + f2) * H * .02);
        g.lineTo(W, H); g.fill();
      }
    }
    g.globalAlpha = 1;
  }

  let arts = [];
  function makeArts(base) {
    const r = rng(base);
    const styles = Object.keys(STYLES), pals = Object.keys(PALETTES);
    arts = TITLES.map((t, i) => ({
      id: i, title: t, seed: Math.floor(r() * 1e9) + 1,
      style: styles[i % styles.length], palette: pals[Math.floor(r() * pals.length)],
      artist: ARTISTS[Math.floor(r() * ARTISTS.length)], year: 2022 + Math.floor(r() * 4),
      ratio: [1, 1.25, .75, 1.4][Math.floor(r() * 4)], likes: 20 + Math.floor(r() * 300)
    }));
  }
  let liked = new Set();
  try { liked = new Set(JSON.parse(localStorage.getItem('rupa-liked') || '[]')); } catch (e) {}
  let filter = 'Semua', visible = [], current = 0;

  function renderGallery() {
    const el = document.getElementById('gallery');
    el.innerHTML = '';
    arts.forEach(a => {
      const b = document.createElement('button');
      b.className = 'item'; b.dataset.id = a.id;
      b.setAttribute('aria-label', `${a.title} oleh ${a.artist}`);
      const cv = document.createElement('canvas');
      b.appendChild(cv);
      b.insertAdjacentHTML('beforeend', `<div class="cap"><b>${a.title}</b><span class="like">${liked.has(a.title) ? '♥' : '♡'} ${a.likes + (liked.has(a.title) ? 1 : 0)}</span></div><div class="cap"><span>${a.artist} · ${a.style}</span></div>`);
      el.appendChild(b);
      draw(cv, a, 1);
    });
    applyFilter();
  }
  function applyFilter() {
    visible = arts.filter(a => filter === 'Semua' || a.style === filter || (filter === 'Disukai' && liked.has(a.title)));
    document.querySelectorAll('.item').forEach(it => it.classList.toggle('hide', !visible.some(a => a.id === +it.dataset.id)));
    document.getElementById('count').textContent = `${visible.length} karya`;
  }
  document.getElementById('filters').innerHTML = ['Semua', ...Object.keys(STYLES), 'Disukai'].map(f => `<button class="${f === filter ? 'active' : ''}" data-f="${f}">${f === 'Disukai' ? '♥ Disukai' : f}</button>`).join('');
  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f;
    [...b.parentNode.children].forEach(x => x.classList.toggle('active', x === b));
    applyFilter();
  });
  document.getElementById('shuffle').addEventListener('click', () => { makeArts(Date.now() % 1e6 + 1); renderGallery(); });

  // Lightbox
  const lb = document.getElementById('lightbox');
  let lastFocus = null;
  function openLB(id) {
    current = visible.findIndex(a => a.id === id);
    lastFocus = document.activeElement;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    showLB();
    document.getElementById('lb-close').focus();
  }
  function showLB() {
    const a = visible[current];
    draw(document.getElementById('lb-canvas'), a, 2);
    document.getElementById('lb-title').textContent = a.title;
    document.getElementById('lb-artist').textContent = `${a.artist}, ${a.year}`;
    document.getElementById('lb-desc').textContent = STYLES[a.style];
    document.getElementById('lb-meta').innerHTML = `<dt>Teknik</dt><dd>${a.style}</dd><dt>Palet</dt><dd>${a.palette}</dd><dt>Seed</dt><dd>${a.seed}</dd><dt>Ukuran</dt><dd>1200 × ${Math.round(1200 * a.ratio)} px</dd>`;
    document.getElementById('lb-palette').innerHTML = PALETTES[a.palette].map(c => `<span style="background:${c}" data-hex="${c}" title="Salin ${c}"></span>`).join('');
    document.getElementById('lb-counter').textContent = `${current + 1} / ${visible.length}`;
    const isLiked = liked.has(a.title);
    const likeBtn = document.getElementById('lb-like');
    likeBtn.textContent = isLiked ? '♥ Disukai' : '♡ Suka';
    likeBtn.classList.toggle('liked', isLiked);
  }
  function closeLB() { lb.classList.remove('open'); document.body.style.overflow = ''; if (lastFocus) lastFocus.focus(); }
  const step = d => { current = (current + d + visible.length) % visible.length; showLB(); };

  document.getElementById('gallery').addEventListener('click', e => { const it = e.target.closest('.item'); if (it) openLB(+it.dataset.id); });
  document.getElementById('lb-close').addEventListener('click', closeLB);
  document.getElementById('lb-prev').addEventListener('click', () => step(-1));
  document.getElementById('lb-next').addEventListener('click', () => step(1));
  lb.addEventListener('click', e => { if (e.target.classList.contains('stage')) closeLB(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLB();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  let tx = null;
  lb.addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
  lb.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); tx = null; });
  document.getElementById('lb-like').addEventListener('click', () => {
    const a = visible[current];
    liked.has(a.title) ? liked.delete(a.title) : liked.add(a.title);
    try { localStorage.setItem('rupa-liked', JSON.stringify([...liked])); } catch (e) {}
    showLB();
    const cap = document.querySelector(`.item[data-id="${a.id}"] .like`);
    cap.textContent = `${liked.has(a.title) ? '♥' : '♡'} ${a.likes + (liked.has(a.title) ? 1 : 0)}`;
  });
  document.getElementById('lb-download').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = visible[current].title.toLowerCase().replace(/\s+/g, '-') + '.png';
    a.href = document.getElementById('lb-canvas').toDataURL('image/png');
    a.click();
  });
  document.getElementById('lb-palette').addEventListener('click', async e => {
    const s = e.target.closest('span'); if (!s) return;
    try { await navigator.clipboard.writeText(s.dataset.hex); s.title = 'Tersalin!'; } catch (err) {}
  });

  // Di dalam pratinjau (iframe) unduhan dan dialog cetak diblokir, jadi tombolnya disembunyikan.
  if (window.self !== window.top) document.getElementById('lb-download').style.display = 'none';
  makeArts(2025);
  renderGallery();
</script>
</body>
</html>
