# QLoRA Qwen2.5-Coder-7B-Instruct untuk GPU 16 GB tanpa bf16 (T4 di Colab/Kaggle) dengan LLaMA-Factory.
# Untuk Colab, notebooks/train_colab_t4.ipynb (Unsloth) lebih mudah dan sudah menyimpan checkpoint ke Drive.
# Dari root repo ini:   llamafactory-cli train train/qwen2.5-coder-7b-qlora-t4.yaml

### model
model_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct
trust_remote_code: true
quantization_bit: 4         # QLoRA, butuh bitsandbytes
use_unsloth: true           # hemat VRAM untuk konteks 8192; butuh `pip install unsloth`. Set false jika tidak tersedia
                            # (tanpa Unsloth, turunkan cutoff_len jika kehabisan memori)

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: instruct_id_mix   # ganti ke instruct_id untuk melatih tanpa campuran
dataset_dir: data
template: qwen
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 2

### output
output_dir: saves/qwen2.5-coder-7b-instruct-id/qlora-t4/sft
logging_steps: 5
save_strategy: steps
save_steps: 20             # checkpoint rutin, untuk melanjutkan jika sesi putus
save_total_limit: 2
plot_loss: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2.0      # naikkan ke 3 jika memakai instruct_id saja
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true                 # T4 tidak mendukung bf16
optim: paged_adamw_8bit
